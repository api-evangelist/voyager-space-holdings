aid: voyager-space-holdings
name: Voyager Technologies
description: >-
  Voyager Technologies, Inc. (NYSE: VOYG), formerly Voyager Space Holdings, is a Denver-based
  defense and space technology company that listed on the New York Stock Exchange in June 2025.
  It delivers domestic end-to-end propulsion and energetics, spectrum-dominance and C4ISR
  electronics, science and space-exploration hardware, mission management and lunar systems, and
  is a partner in the Starlab commercial space station. Since 2019 it has acquired twelve
  companies, including Nanoracks (commercial ISS payload services), ZIN Technologies, Space Micro,
  Valley Tech Systems, Altius Space Machines, ExoTerra, Estes Energetics and Astrobotic. Voyager
  Space rebranded to Voyager Technologies in January 2025; voyagerspace.com now redirects to
  voyagertechnologies.com. The company publishes no developer program, public API, SDK or
  machine-readable contract; the only machine surface on its domain is the WordPress MCP adapter
  guarding the corporate CMS.
